<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle at 20% 20%, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            perspective: 1200px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
            width: 100%;
            max-width: 820px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 92vh;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            will-change: transform;
        }

        .header {
            background: linear-gradient(135deg, #0f3460 0%, #533483 50%, #e94560 100%);
            color: white;
            padding: 22px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .header::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
            animation: shine 6s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        .header h1 { font-size: 22px; margin-bottom: 5px; position: relative; z-index: 1; }
        .header p { font-size: 13px; opacity: 0.9; position: relative; z-index: 1; }

        .logo-3d {
            width: 50px; height: 50px;
            margin: 0 auto 10px;
            transform-style: preserve-3d;
            animation: spin 8s linear infinite;
            position: relative; z-index: 1;
        }
        .logo-3d .face {
            position: absolute;
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #e94560, #533483);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(233,69,96,0.6);
        }
        .logo-3d .front  { transform: translateZ(25px); }
        .logo-3d .back   { transform: translateZ(-25px) rotateY(180deg); }
        .logo-3d .right  { transform: rotateY(90deg) translateZ(25px); }
        .logo-3d .left   { transform: rotateY(-90deg) translateZ(25px); }
        @keyframes spin {
            0% { transform: rotateY(0deg) rotateX(10deg); }
            100% { transform: rotateY(360deg) rotateX(10deg); }
        }

        .client-bar {
            display: flex; gap: 10px;
            padding: 15px 20px;
            background: #f7f7fb;
            border-bottom: 1px solid #eee;
            align-items: center;
        }
        .client-bar label { font-size: 13px; color: #555; font-weight: 600; }
        .client-bar input {
            flex: 1; padding: 8px 12px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .client-bar input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }

        .upload-zone {
            margin: 15px 20px;
            border: 2px dashed #b0b0d0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            background: #fafaff;
            transform: translateZ(10px);
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateZ(20px) scale(1.01);
            box-shadow: 0 10px 30px rgba(102,126,234,0.2);
        }
        .upload-zone p { font-size: 14px; color: #666; }
        .upload-zone .status { font-size: 13px; margin-top: 8px; font-weight: 600; }

        .chat-area {
            flex: 1; overflow-y: auto;
            padding: 20px;
            background: #fafafa;
            display: flex; flex-direction: column; gap: 12px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.35s ease;
            transform-style: preserve-3d;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) rotateX(-10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
        }
        .message.bot {
            align-self: flex-start;
            background: white;
            color: #333;
            border: 1px solid #eee;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .message.error {
            align-self: flex-start;
            background: #ffe0e0;
            color: #c00;
            border: 1px solid #f5c0c0;
        }
        .typing {
            align-self: flex-start;
            background: white;
            border: 1px solid #eee;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex; gap: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .typing span {
            width: 8px; height: 8px;
            background: #999; border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .input-bar {
            display: flex; padding: 15px 20px;
            background: white; border-top: 1px solid #eee; gap: 10px;
        }
        .input-bar input {
            flex: 1; padding: 12px 16px;
            border: 1px solid #ddd; border-radius: 24px;
            font-size: 14px; outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .input-bar input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .input-bar button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 24px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
        }
        .input-bar button:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 10px 30px rgba(102,126,234,0.6);
        }
        .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Custom scrollbar */
        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb {
            background: #c0c0e0; border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container" id="card">
        <div class="header">
            <div class="logo-3d">
                <div class="face front">📄</div>
                <div class="face back">🤖</div>
                <div class="face right">💬</div>
                <div class="face left">✨</div>
            </div>
            <h1>AI Document Assistant</h1>
            <p>Upload a PDF and ask questions about it</p>
        </div>

        <div class="client-bar">
            <label for="clientId">Client ID:</label>
            <input id="clientId" type="text" value="umar" placeholder="e.g. umar">
        </div>

        <div class="upload-zone" id="uploadZone">
            <p>📎 Drag & drop a PDF here, or click to browse</p>
            <p class="status" id="uploadStatus"></p>
            <input type="file" id="pdfFile" accept=".pdf" hidden>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="message bot">Hello! Upload a PDF above, then ask me anything about it.</div>
        </div>

        <div class="input-bar">
            <input id="input" type="text" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') send()">
            <button id="sendBtn" onclick="send()">Send</button>
        </div>
    </div>

    <script>
        const BASE_URL = "http://127.0.0.1:8000";
        const chatArea = document.getElementById("chatArea");
        const uploadZone = document.getElementById("uploadZone");
        const pdfFile = document.getElementById("pdfFile");
        const uploadStatus = document.getElementById("uploadStatus");
        const sendBtn = document.getElementById("sendBtn");
        const card = document.getElementById("card");

        // --- 3D card tilt on mouse move ---
        document.addEventListener("mousemove", (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * -10;
            card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });
        document.addEventListener("mouseleave", () => {
            card.style.transform = "rotateY(0) rotateX(0)";
        });

        // --- Drag & drop upload ---
        uploadZone.addEventListener("click", () => pdfFile.click());
        uploadZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadZone.classList.add("dragover");
        });
        uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("dragover"));
        uploadZone.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadZone.classList.remove("dragover");
            if (e.dataTransfer.files.length) {
                pdfFile.files = e.dataTransfer.files;
                uploadPdf();
            }
        });
        pdfFile.addEventListener("change", uploadPdf);

        async function uploadPdf() {
            const clientId = document.getElementById("clientId").value.trim();
            if (!clientId) { alert("Please enter a Client ID first."); return; }
            if (!pdfFile.files.length) return;

            const formData = new FormData();
            formData.append("file", pdfFile.files[0]);
            formData.append("client_id", clientId);

            uploadStatus.style.color = "#667eea";
            uploadStatus.textContent = "⏳ Uploading and indexing...";

            try {
                const res = await fetch(`${BASE_URL}/upload`, { method: "POST", body: formData });
                const data = await res.json();
                if (data.error) {
                    uploadStatus.style.color = "#c00";
                    uploadStatus.textContent = "❌ " + data.error;
                } else {
                    uploadStatus.style.color = "#2a9d5c";
                    uploadStatus.textContent = `✅ Indexed ${data.chunks_indexed} chunks for "${data.client_id}"`;
                }
            } catch (err) {
                uploadStatus.style.color = "#c00";
                uploadStatus.textContent = "❌ Upload failed";
            }
        }

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement("div");
            div.className = "typing";
            div.id = "typing";
            div.innerHTML = "<span></span><span></span><span></span>";
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTyping() {
            const t = document.getElementById("typing");
            if (t) t.remove();
        }

        async function send() {
            const clientId = document.getElementById("clientId").value.trim();
            const input = document.getElementById("input");
            const text = input.value.trim();
            if (!text || !clientId) return;

            addMessage(text, "user");
            input.value = "";
            sendBtn.disabled = true;
            showTyping();

            try {
                const res = await fetch(`${BASE_URL}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: text, client_id: clientId })
                });
                const data = await res.json();
                hideTyping();
                if (data.error) {
                    addMessage("Error: " + data.error, "error");
                } else {
                    addMessage(data.answer, "bot");
                }
            } catch (err) {
                hideTyping();
                addMessage("Error: could not reach server.", "error");
            }
            sendBtn.disabled = false;
        }
    </script>
</body>
</html>
